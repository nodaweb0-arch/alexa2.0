<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente ESP32</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--txt:#e8eaee;--mut:#8b919c;--ok:#34d399;--bad:#f87171;--acc:#60a5fa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
  h1{font-size:1.2rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  #estado{font-size:.8rem;color:var(--bad)} #estado.on{color:var(--ok)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border-radius:12px;padding:12px}
  .card small{color:var(--mut);display:block}
  .card b{font-size:1.6rem}
  .alarma b{color:var(--bad)}
  button{border:0;border-radius:12px;font-size:1rem;cursor:pointer;color:var(--txt);background:var(--card);padding:12px}
  #mic,#wake{width:100%;margin:14px 0;padding:18px;background:var(--acc);color:#04111f;font-weight:700}
  #mic.esc,#wake.activo{background:var(--bad)}
  #rele{width:100%;margin-top:10px}
  #log{background:var(--card);border-radius:12px;padding:10px;height:220px;overflow:auto;font-size:.95rem;margin-top:10px}
  #log p{margin:6px 0}.yo{color:var(--acc)}.ia{color:var(--ok)}.err{color:var(--bad)}
  input{width:100%;background:var(--card);border:1px solid #2a2f3a;color:var(--txt);border-radius:8px;padding:8px;margin-top:10px}
  .ayuda{color:var(--mut);font-size:.85rem;margin:6px 0 0}
</style>
</head>
<body>
<h1>Asistente <span id="estado">sin conexión</span></h1>

<div class="grid">
  <div class="card" id="ct"><small>Temperatura</small><b id="t">--</b> °C</div>
  <div class="card"><small>Humedad</small><b id="h">--</b> %</div>
  <div class="card" id="cc"><small>Corriente</small><b id="i">--</b> A</div>
  <div class="card"><small>Tiempo de uso</small><b id="u">--</b></div>
</div>
<button id="rele">Aparato: --</button>
<button id="mic">🎤 Hablar</button>
<button id="wake" type="button">Activar “Kovelt”</button>
<div id="log"></div>
<input id="ip" placeholder="IP del ESP32 (ej: 192.168.1.50)">
<p class="ayuda">Ingresá la IP que muestra el Monitor Serie del ESP32 y tocá fuera del campo para probar.</p>

<script>
/* La página es https y el ESP32 es http. En Chrome: ícono a la izquierda de la URL >
   Configuración del sitio > Contenido no seguro > Permitir (y Acceso a la red local > Permitir). */
const $ = id => document.getElementById(id);
let ip = localStorage.getItem('ip') || '192.168.4.1';
let datos = null, historial = [];
$('ip').value = ip;
$('ip').onchange = e => {
  ip = e.target.value.trim().replace('http://', '');
  localStorage.setItem('ip', ip);
  actualizar();
};

const esp = async path => {
  const r = await fetch('http://' + ip + path, { signal: AbortSignal.timeout(4000) });
  if (!r.ok) throw new Error('ESP32 respondió HTTP ' + r.status);
  return r.json();
};

const log = (cls, txt) => {
  const p = document.createElement('p'); p.className = cls; p.textContent = txt;
  $('log').appendChild(p); $('log').scrollTop = 1e9;
};

const hms = s => Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm ' + (s % 60) + 's';

function pintar(d) {
  datos = d;
  $('t').textContent = d.temperatura == null ? '--' : d.temperatura;
  $('h').textContent = d.humedad == null ? '--' : d.humedad;
  $('i').textContent = d.corriente;
  $('u').textContent = hms(d.segundos_uso);
  $('rele').textContent = 'Aparato: ' + (d.rele ? 'ENCENDIDO' : 'APAGADO');
  $('cc').classList.toggle('alarma', d.alarma_corriente);
  $('ct').classList.toggle('alarma', d.alarma_temp);
}

async function actualizar() {
  try {
    pintar(await esp('/api/datos'));
    $('estado').textContent = 'conectado'; $('estado').className = 'on';
  } catch (e) {
    $('estado').textContent = 'sin conexión'; $('estado').className = '';
  }
}
setInterval(actualizar, 2000); actualizar();

$('rele').onclick = async () => {
  try { pintar(await esp('/api/rele?estado=toggle')); }
  catch (e) { log('err', 'No me pude comunicar con el ESP32.'); }
};

// ---------- Voz del celular ----------
function elegirVoz() {
  const voces = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('es'));
  const orden = ['es-AR', 'es-MX', 'es-US', 'es-419', 'es-ES'];
  for (const l of orden) {
    const v = voces.find(x => x.lang.split('_').join('-') === l);
    if (v) return v;
  }
  return voces[0] || null;
}

function hablar(txt) {
  log('ia', txt);
  let limpio = txt.split(' ').filter(w => !w.startsWith('http')).join(' ');
  for (const s of ['*', '_', '#', '`', '>']) limpio = limpio.split(s).join('');
  speechSynthesis.cancel();
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(limpio);
    const v = elegirVoz();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-AR'; }
    u.rate = 1.05;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

// ---------- Comandos (sin expresiones regulares) ----------
const APAGAR = ['apaga', 'apagar', 'apagalo', 'apagala', 'apagame', 'desactiva', 'desactivalo', 'corta', 'cortalo'];
const PRENDER = ['prende', 'prender', 'prendelo', 'prendela', 'enciende', 'encender', 'encendelo', 'enciendelo', 'activa', 'activar', 'activalo', 'pone', 'ponelo'];
const INICIO_PREGUNTA = ['que', 'cual', 'cuanto', 'cuantos', 'como', 'esta', 'estan', 'por', 'quien', 'donde', 'cuando'];

async function procesar(texto) {
  log('yo', texto);
  const t = texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const palabras = t.split(' ');
  const esPregunta = INICIO_PREGUNTA.includes(palabras[0]) || texto.includes('?');
  const tiene = lista => palabras.some(p => lista.includes(p));
  try {
    if (!esPregunta && palabras.length < 8 && tiene(APAGAR)) {
      pintar(await esp('/api/rele?estado=off')); return await hablar('Listo, apagado.');
    }
    if (!esPregunta && palabras.length < 8 && tiene(PRENDER)) {
      pintar(await esp('/api/rele?estado=on')); return await hablar('Listo, encendido.');
    }
    if (t.includes('temperatura') && datos)
      return await hablar(datos.temperatura == null ? 'El sensor de temperatura no está dando datos.' : 'Hay ' + datos.temperatura + ' grados.');
    if (t.includes('humedad') && datos)
      return await hablar(datos.humedad == null ? 'El sensor de humedad no está dando datos.' : 'La humedad es del ' + datos.humedad + ' por ciento.');
    if ((t.includes('corriente') || t.includes('consumo')) && datos)
      return await hablar('El consumo es de ' + datos.corriente + ' amperes.');
    if ((t.includes('cuanto tiempo') || t.includes('tiempo de uso')) && datos)
      return await hablar('Estuvo encendido ' + hms(datos.segundos_uso) + '.');
  } catch (e) {
    esp('/api/sonido?tipo=error').catch(() => {});
    return await hablar('No me pude comunicar con el dispositivo.');
  }

  // Pregunta general -> IA
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pregunta: texto, contexto: Object.assign({ ahora: new Date().toLocaleString('es-AR', { dateStyle: 'full', timeStyle: 'short' }) }, datos || {}), historial })
    });
    const res = await r.json();
    if (res.error) throw new Error(res.error);

    for (const accion of (Array.isArray(res.acciones) ? res.acciones : [])) {
      if (accion?.tipo === 'rele' && ['on', 'off'].includes(accion.estado)) {
        try {
          pintar(await esp('/api/rele?estado=' + encodeURIComponent(accion.estado)));
        } catch (e) {
          log('err', 'No se pudo ejecutar la acción en el dispositivo.');
        }
      }
    }

    historial.push({ role: 'user', content: texto }, { role: 'assistant', content: res.respuesta });
    historial = historial.slice(-8);
    await hablar(res.respuesta || 'No recibí una respuesta.');
  } catch (e) {
    log('err', 'Error con la IA: ' + e.message);
  }
}

// ---------- Palabra de activación Kovelt ----------
const PALABRA_CLAVE = 'kovelt';
let escuchaActiva = false;
let procesando = false;
let atentoHasta = 0;
let recWake = null;

function normalizar(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/c/g, 'k').replace(/[bw]/g, 'v')
    .replace(/[^a-z0-9]/g, '');
}

function distancia(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1,
        d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  return d[a.length][b.length];
}

function esPalabraClave(w) {
  const n = normalizar(w);
  return n.length >= 4 && distancia(n, normalizar(PALABRA_CLAVE)) <= 1;
}

function despuesDeLaPalabra(texto) {
  const p = texto.split(/\s+/).filter(Boolean);
  for (let i = 0; i < p.length; i++) {
    if (esPalabraClave(p[i])) return p.slice(i + 1).join(' ').trim();
    if (i + 1 < p.length && esPalabraClave(p[i] + p[i + 1])) return p.slice(i + 2).join(' ').trim();
  }
  return null;
}

function iniciarEscucha() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Este navegador no tiene reconocimiento de voz. Usá Chrome.'); return; }
  if (escuchaActiva) return;

  recWake = new SR();
  recWake.lang = 'es-AR';
  recWake.continuous = true;
  recWake.interimResults = false;
  recWake.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) alOirFrase(e.results[i][0].transcript.trim());
    }
  };
  recWake.onend = () => {
    if (escuchaActiva && !procesando) setTimeout(reanudar, 300);
  };
  recWake.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      escuchaActiva = false;
      $('wake').textContent = 'Activar “Kovelt”';
      $('wake').classList.remove('activo');
      log('err', 'Permiso de micrófono denegado o falta HTTPS.');
    }
  };

  escuchaActiva = true;
  $('wake').textContent = 'Desactivar “Kovelt”';
  $('wake').classList.add('activo');
  reanudar();
}

function detenerEscucha() {
  escuchaActiva = false;
  atentoHasta = 0;
  $('wake').textContent = 'Activar “Kovelt”';
  $('wake').classList.remove('activo');
  try { recWake?.stop(); } catch (_) {}
}

function reanudar() {
  if (!recWake || !escuchaActiva || procesando) return;
  try { recWake.start(); } catch (_) { /* ya estaba iniciado */ }
}

function alOirFrase(texto) {
  if (procesando) return;
  const orden = despuesDeLaPalabra(texto);
  if (orden === null) {
    if (Date.now() < atentoHasta) { atentoHasta = 0; ejecutar(texto); }
    return;
  }
  if (orden) { ejecutar(orden); return; }
  atentoHasta = Date.now() + 6000;
  fetch('http://' + ip + '/api/beep', { signal: AbortSignal.timeout(2000) }).catch(() => {});
}

async function ejecutar(orden) {
  procesando = true;
  try { recWake?.stop(); } catch (_) {}
  try { await procesar(orden); }
  catch (e) { console.error(e); }
  procesando = false;
  if (escuchaActiva) setTimeout(reanudar, 300);
}

$('wake').onclick = () => escuchaActiva ? detenerEscucha() : iniciarEscucha();

// ---------- Micrófono manual ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $('mic').disabled = true;
  log('err', 'Este navegador no soporta reconocimiento de voz. Usá Chrome.');
} else {
  const rec = new SR();
  rec.lang = 'es-AR'; rec.interimResults = false;
  rec.onstart = () => { $('mic').classList.add('esc'); $('mic').textContent = '🎙️ Escuchando...'; esp('/api/sonido?tipo=ok').catch(() => {}); };
  rec.onend = () => { $('mic').classList.remove('esc'); $('mic').textContent = '🎤 Hablar'; };
  rec.onerror = e => log('err', 'Micrófono: ' + e.error);
  rec.onresult = e => procesar(e.results[0][0].transcript);
  $('mic').onclick = () => { speechSynthesis.cancel(); try { rec.start(); } catch (e) {} };
}
</script>
</body>
</html>
