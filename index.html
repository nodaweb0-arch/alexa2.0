<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistente ESP32</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--txt:#e8eaee;--mut:#8b919c;--ok:#34d399;--bad:#f87171;--acc:#60a5fa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:16px;max-width:520px;margin:auto}
  h1{font-size:1.2rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  #estado{font-size:.8rem;color:var(--bad)} #estado.on{color:var(--ok)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--card);border-radius:12px;padding:12px}
  .card small{color:var(--mut);display:block}
  .card b{font-size:1.6rem}
  .alarma b{color:var(--bad)}
  button{border:0;border-radius:12px;font-size:1rem;cursor:pointer;color:var(--txt);background:var(--card);padding:12px}
  #mic{width:100%;margin:14px 0;padding:18px;background:var(--acc);color:#04111f;font-weight:700}
  #mic.esc{background:var(--bad)}
  #rele{width:100%;margin-top:10px}
  #log{background:var(--card);border-radius:12px;padding:10px;height:220px;overflow:auto;font-size:.95rem;margin-top:10px}
  #log p{margin:6px 0}.yo{color:var(--acc)}.ia{color:var(--ok)}.err{color:var(--bad)}
  input{width:100%;background:var(--card);border:1px solid #2a2f3a;color:var(--txt);border-radius:8px;padding:8px;margin-top:10px}
</style>
</head>
<body>
<h1>Asistente <span id="estado">sin conexión</span></h1>

<div class="grid">
  <div class="card"><small>Temperatura</small><b id="t">--</b> °C</div>
  <div class="card"><small>Humedad</small><b id="h">--</b> %</div>
  <div class="card" id="cc"><small>Corriente</small><b id="i">--</b> A</div>
  <div class="card"><small>Tiempo de uso</small><b id="u">--</b></div>
</div>
<button id="rele">Aparato: --</button>
<button id="mic">🎤 Hablar</button>
<div id="log"></div>
<input id="ip" placeholder="IP del ESP32 (ej: 192.168.1.50)">

<script>
/* Ojo: esta página es https y el ESP32 es http. En Chrome del celular:
   Configuración del sitio > Contenido no seguro > Permitir. */
const $ = id => document.getElementById(id);
let ip = localStorage.getItem('ip') || '192.168.4.1';
let datos = null, historial = [];
$('ip').value = ip;
$('ip').onchange = e => { ip = e.target.value.trim(); localStorage.setItem('ip', ip); };

const esp = async path => {
  const r = await fetch(`http://${ip}${path}`, { signal: AbortSignal.timeout(4000) });
  return r.json();
};

const log = (cls, txt) => {
  const p = document.createElement('p'); p.className = cls; p.textContent = txt;
  $('log').appendChild(p); $('log').scrollTop = 1e9;
};

const hms = s => `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m ${s % 60}s`;

function pintar(d) {
  datos = d;
  $('t').textContent = d.temperatura ?? '--';
  $('h').textContent = d.humedad ?? '--';
  $('i').textContent = d.corriente;
  $('u').textContent = hms(d.segundos_uso);
  $('rele').textContent = 'Aparato: ' + (d.rele ? 'ENCENDIDO' : 'APAGADO');
  $('cc').classList.toggle('alarma', d.alarma_corriente);
  $('t').parentElement.classList.toggle('alarma', d.alarma_temp);
}

async function actualizar() {
  try {
    pintar(await esp('/api/datos'));
    $('estado').textContent = 'conectado'; $('estado').className = 'on';
  } catch {
    $('estado').textContent = 'sin conexión'; $('estado').className = '';
  }
}
setInterval(actualizar, 2000); actualizar();

$('rele').onclick = async () => pintar(await esp('/api/rele?estado=toggle'));

// ---------- Voz del celular ----------
function hablar(txt) {
  log('ia', txt);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'es-AR';
  speechSynthesis.speak(u);
}

// ---------- Comandos ----------
async function procesar(texto) {
  log('yo', texto);
  const t = texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const esPregunta = /^(que|cual|cuanto|cuantos|como|esta|estan|por que|porque|porqué|quien|donde|cuando|hay|hace|me dices|podrias|podes|puedes)\b/.test(t) || /\?/.test(texto);

  try {
    if (!esPregunta && t.length < 80 && /\b(apag(a|ar|alo|ala|ate|uen|uenme)|desactiv(a|ar|alo|ala|ate)|cort(a|ar|alo|ala|ate))\b/.test(t)) {
      pintar(await esp('/api/rele?estado=off'));
      return hablar('Listo, apagado.');
    }

    if (!esPregunta && t.length < 80 && /\b(prend(e|er|elo|ela|ete)|encend(e|er|elo|ela|ete)|enciend(e|elo|ela)|activ(a|ar|alo|ala|ate)|pon(e|er|elo|ela|ete)|enciende|activa)\b/.test(t)) {
      pintar(await esp('/api/rele?estado=on'));
      return hablar('Listo, encendido.');
    }

    if ((/temperatura|calor|frio/.test(t) || /cuanta.*temperatura/.test(t)) && datos) {
      if (datos.temperatura == null) return hablar('El sensor de temperatura no está dando datos.');
      return hablar(`Hay ${datos.temperatura} grados.`);
    }

    if ((/humedad|mojado|seco/.test(t) || /cuanta.*humedad/.test(t)) && datos) {
      if (datos.humedad == null) return hablar('El sensor de humedad no está dando datos.');
      return hablar(`La humedad es del ${datos.humedad} por ciento.`);
    }

    if ((/corriente|consumo|electricidad|energia|watts/.test(t) || /cuanto.*consumo/.test(t)) && datos) {
      return hablar(`El consumo es de ${datos.corriente} amperes.`);
    }

    if ((/tiempo de uso|cuanto tiempo|cuanto estuvo|duracion|duración|uso/.test(t)) && datos) {
      return hablar(`Estuvo encendido ${hms(datos.segundos_uso)}.`);
    }

    if ((/estado|como esta|como va|status/.test(t)) && datos) {
      const estadoRel = datos.rele ? 'encendido' : 'apagado';
      return hablar(`El aparato está ${estadoRel}.`);
    }
  } catch (error) {
    esp('/api/sonido?tipo=error').catch(() => {});
    return hablar('No me pude comunicar con el dispositivo.');
  }

  // Pregunta general -> IA
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pregunta: texto, contexto: datos, historial })
    });
    const { respuesta, error } = await r.json();
    if (error) throw new Error(error);
    historial.push({ role: 'user', content: texto }, { role: 'assistant', content: respuesta });
    historial = historial.slice(-8);
    hablar(respuesta);
  } catch (e) {
    log('err', 'Error con la IA: ' + e.message);
  }
}

// ---------- Micrófono ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { $('mic').disabled = true; log('err', 'Este navegador no soporta reconocimiento de voz. Usá Chrome.'); }
else {
  const rec = new SR();
  rec.lang = 'es-AR'; rec.interimResults = false;
  rec.onstart = () => { $('mic').classList.add('esc'); $('mic').textContent = '🎙️ Escuchando...'; esp('/api/sonido?tipo=ok').catch(() => {}); };
  rec.onend = () => { $('mic').classList.remove('esc'); $('mic').textContent = '🎤 Hablar'; };
  rec.onerror = e => log('err', 'Micrófono: ' + e.error);
  rec.onresult = e => procesar(e.results[0][0].transcript);
  $('mic').onclick = () => { speechSynthesis.cancel(); rec.start(); };
}
</script>
</body>
</html>
